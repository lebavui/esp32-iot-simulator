# /etc/nginx/sites-available/iot.dcelab.io.vn
# Reverse proxy tới container esp32sim (127.0.0.1:8020). Chứng chỉ HTTPS do certbot thêm vào.

# Giới hạn tần suất gọi /__proxy (HTTPClient mô phỏng) để tránh bị lạm dụng.
limit_req_zone $binary_remote_addr zone=esp32sim_proxy:10m rate=5r/s;
# Tạo link chia sẻ (POST /__share): server.js còn giới hạn SHARE_RATE link mới/giờ/IP
limit_req_zone $binary_remote_addr zone=esp32sim_share:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name iot.dcelab.io.vn;

    # Request /__proxy có thân tối đa 2 MB (server.js giới hạn)
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    location = /__proxy {
        limit_req zone=esp32sim_proxy burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Cầu nối MQTT WebSocket → TCP (broker chỉ có cổng TCP 1883, vd. thingsboard.cloud)
    location = /__proxy/mqtt {
        limit_req zone=esp32sim_proxy burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    # Lưu dự án để tạo link chia sẻ ngắn (#s=…); server.js giới hạn 64 KB/dự án
    location = /__share {
        limit_req zone=esp32sim_share burst=10 nodelay;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
