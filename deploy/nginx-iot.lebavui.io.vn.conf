# /etc/nginx/sites-available/iot.lebavui.io.vn
# Reverse proxy tới container esp32sim (127.0.0.1:8020). Chứng chỉ HTTPS do certbot thêm vào.

# Giới hạn tần suất gọi /__proxy (HTTPClient mô phỏng) để tránh bị lạm dụng.
limit_req_zone $binary_remote_addr zone=esp32sim_proxy:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name iot.lebavui.io.vn;

    # Request /__proxy có thân tối đa 2 MB (server.js giới hạn)
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    location = /__proxy {
        limit_req zone=esp32sim_proxy burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
